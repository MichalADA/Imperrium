services:
  postgres:
    image: postgres:16-alpine
    container_name: imperium-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imperium_wiki}
      POSTGRES_USER: ${POSTGRES_USER:-imperium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imperium_local_password}
    volumes:
      - imperium_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - imperium-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imperium-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-imperium}:${POSTGRES_PASSWORD:-imperium_local_password}@postgres:5432/${POSTGRES_DB:-imperium_wiki}?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      LORE_IMPORT_DIR: /app/lore/imports
    volumes:
      - imperium_uploads:/app/uploads
      - ./lore/imports:/app/lore/imports:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - imperium-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imperium-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks:
      - imperium-network

volumes:
  imperium_postgres_data:
  imperium_uploads:

networks:
  imperium-network:
    driver: bridge
